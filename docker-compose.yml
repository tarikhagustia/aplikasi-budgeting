# Money Management — docker-compose
# Jalankan: docker compose up -d --build
# Akses:   http://localhost:3000 (web) · http://localhost:3001/mcp (MCP HTTP)
#
# Dua service dalam SATU tempat (compose yang sama), share database yang sama:
#   - web : aplikasi PWA (port 3000)
#   - mcp : MCP server mode HTTP (port 3001) — AI client connect ke http://localhost:3001/mcp
#
# Database disimpan sebagai bind mount ./database/ (folder lokal, bukan Docker volume) —
# gampang di-backup / dilihat langsung dari host.
#
# Ganti PIN:   APP_PIN=987654 docker compose up -d
# Reset data:  hapus isi folder ./database/ manual (⚠️ backup dulu kalau perlu)

services:
  web:
    build: .
    container_name: money-management
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - APP_PIN=${APP_PIN:-123456}
      - MONEY_DB_PATH=/data/money_management.db
    volumes:
      - ./database:/data
    restart: unless-stopped

  mcp:
    build: .
    container_name: money-management-mcp
    command: ["node", "mcp-server.mjs"]
    environment:
      - MCP_TRANSPORT=http
      - MCP_PORT=3001
      - MCP_API_KEY=${MCP_API_KEY:-${APP_PIN:-123456}}
      - MONEY_DB_PATH=/data/money_management.db
    ports:
      - "3001:3001"
    volumes:
      - ./database:/data
    restart: unless-stopped
    depends_on:
      - web

volumes:
  money-data:
